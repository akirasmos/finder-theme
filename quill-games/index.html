<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games — The Quill</title>
  <meta name="description" content="Daily word games and puzzles from The Quill: Quirdle and The Mini Crossword.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/games.css">
</head>
<body>
  <header class="games-header">
    <a class="brand" href="index.html">
      <span class="masthead">The Quill</span><span class="section">Games</span>
    </a>
    <!-- Point this at your newspaper's home page -->
    <a href="../" style="font-size:14px;font-weight:600">← Back to The Quill</a>
  </header>

  <main class="hub">
    <section class="hub-hero">
      <div class="eyebrow" id="today"></div>
      <h1>The Quill Games</h1>
      <p>New puzzles every day. Take a break from homework.</p>
    </section>

    <section class="game-grid">
      <a class="game-card quirdle" href="quirdle.html">
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 96 96">
            <rect x="4" y="4" width="26" height="26" rx="2" fill="#538d4e"/>
            <rect x="35" y="4" width="26" height="26" rx="2" fill="#c9b458"/>
            <rect x="66" y="4" width="26" height="26" rx="2" fill="#787c7e"/>
            <rect x="4" y="35" width="26" height="26" rx="2" fill="#787c7e"/>
            <rect x="35" y="35" width="26" height="26" rx="2" fill="#538d4e"/>
            <rect x="66" y="35" width="26" height="26" rx="2" fill="#c9b458"/>
            <rect x="4" y="66" width="26" height="26" rx="2" fill="#538d4e"/>
            <rect x="35" y="66" width="26" height="26" rx="2" fill="#538d4e"/>
            <rect x="66" y="66" width="26" height="26" rx="2" fill="#538d4e"/>
            <text x="17" y="87" font-family="Libre Franklin, Arial" font-weight="800" font-size="18" fill="#fff" text-anchor="middle">Q</text>
          </svg>
        </div>
        <div class="body">
          <h2>Quirdle</h2>
          <p class="desc">Get 6 chances to guess a 5-letter word.</p>
          <div class="status" id="quirdle-status"></div>
          <span class="play">Play</span>
        </div>
      </a>

      <a class="game-card mini" href="mini.html">
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 96 96">
            <rect x="3" y="3" width="90" height="90" fill="#fff" stroke="#121212" stroke-width="4"/>
            <g stroke="#121212" stroke-width="1.5">
              <line x1="21" y1="3" x2="21" y2="93"/><line x1="39" y1="3" x2="39" y2="93"/>
              <line x1="57" y1="3" x2="57" y2="93"/><line x1="75" y1="3" x2="75" y2="93"/>
              <line x1="3" y1="21" x2="93" y2="21"/><line x1="3" y1="39" x2="93" y2="39"/>
              <line x1="3" y1="57" x2="93" y2="57"/><line x1="3" y1="75" x2="93" y2="75"/>
            </g>
            <rect x="3" y="3" width="36" height="18" fill="#121212"/>
            <rect x="3" y="21" width="18" height="18" fill="#121212"/>
            <rect x="75" y="57" width="18" height="18" fill="#121212"/>
            <rect x="57" y="75" width="36" height="18" fill="#121212"/>
            <rect x="21" y="21" width="18" height="18" fill="#ffda00"/>
            <rect x="39" y="21" width="54" height="18" fill="#a7d8ff"/>
          </svg>
        </div>
        <div class="body">
          <h2>The Mini</h2>
          <p class="desc">Solve this bite-sized crossword in just a few minutes.</p>
          <div class="status" id="mini-status"></div>
          <span class="play">Play</span>
        </div>
      </a>
    </section>

    <p class="hub-footer">Puzzles by The Quill staff · A new set drops every day at midnight</p>
  </main>

  <script src="js/common.js"></script>
  <script>
    (function () {
      var day = Quill.puzzleNumber();
      document.getElementById("today").textContent = Quill.prettyDate();

      var q = Quill.load("quirdle-state", null);
      var qs = document.getElementById("quirdle-status");
      if (q && q.day === day) {
        if (q.status === "won") { qs.textContent = "✓ Solved in " + q.guesses.length + "/6"; qs.classList.add("done"); }
        else if (q.status === "lost") qs.textContent = "Better luck tomorrow";
        else if (q.guesses.length) qs.textContent = "In progress · " + q.guesses.length + "/6 guesses";
      }
      if (!qs.textContent) qs.textContent = "Quirdle #" + (day + 1);

      var m = Quill.load("mini-state", null);
      var ms = document.getElementById("mini-status");
      if (m && m.day === day && m.done) { ms.textContent = "✓ Solved in " + Quill.formatTime(m.seconds); ms.classList.add("done"); }
      else if (m && m.day === day && m.started) ms.textContent = "In progress · " + Quill.formatTime(m.seconds);
      else ms.textContent = "Mini #" + (day + 1);
    })();
  </script>
</body>
</html>
